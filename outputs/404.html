<!doctype html>
<html lang="zh-CN">
<head>

  <title>页面没有找到｜玄英</title>
  <style>
    :root { --paper: #F6F8F1; --ink: #17251D; --green: #3D8B68; --green-deep: #246044; --muted: #718078; --line: #D7E2D7; --serif: "Iowan Old Style", "Baskerville", "Times New Roman", serif; --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); line-height: 1.8; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(calc(100% - 48px), 1120px); margin: 0 auto; }
    .site-header { border-bottom: 1px solid var(--line); }
    .nav-wrap { display: flex; align-items: center; min-height: 76px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--green-deep); border-radius: 50%; color: var(--green-deep); }
    .brand-mark svg { width: 29px; height: 29px; }
    .brand-copy span { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .13em; }
    main { padding: 18vh 0 20vh; }
    .error-copy { max-width: 620px; }
    .eyebrow { margin: 0 0 18px; color: var(--green-deep); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0 0 20px; font-family: var(--serif); font-size: clamp(52px, 9vw, 100px); font-weight: 400; letter-spacing: -.06em; line-height: 1; }
    p { margin: 0 0 28px; color: var(--muted); font-size: 16px; }
    .home-link { display: inline-flex; padding-bottom: 5px; border-bottom: 1px solid var(--green); color: var(--green-deep); font-size: 13px; font-weight: 800; }
    @media (max-width: 650px) { .container { width: calc(100% - 32px); } .nav-wrap { min-height: 68px; } .brand { gap: 9px; font-size: 13px; } .brand-mark { width: 34px; height: 34px; } .brand-mark svg { width: 26px; height: 26px; } .brand-copy span { display: none; } main { padding: 15vh 0 18vh; } }
  </style>
</head>
<body>
  <header class="site-header">

        <span class="brand-copy">玄英 <span>/ XUAN YING</span></span>
      </a>
    </div>
  </header>
  <main>
    <div class="container error-copy">
      <p class="eyebrow">404 / NOT FOUND</p>
      <h1>这页还没有找到。</h1>
      <p>也许链接已经改变，或者这段记录还没有公开。</p>
      <a class="home-link" href="index.html">返回首页 →</a>
    </div>
  </main>
</body>
